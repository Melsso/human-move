[build-system]
requires = ["uv_build>=0.9.0,<0.12"]
build-backend = "uv_build"

[project]
name = "chess-backend"
version = "0.1.0"
description = "FastAPI inference service: serves moves for each rating tier using the shared tier configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess-shared",
    "chess-training",
    "python-chess>=1.999",
    "numpy>=1.26",
    "torch>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
chess-shared = { workspace = true }
chess-training = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv.build-backend]
module-root = ""
module-name = "chess_backend"