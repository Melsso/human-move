[build-system]
requires = ["uv_build>=0.9.0,<0.12"]
build-backend = "uv_build"

[project]
name = "chess-training"
version = "0.1.0"
description = "Model definition, training loop, and elo calibration for the rating-bucketed chess policy networks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess-shared",
    "torch>=2.3",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[tool.uv.sources]
chess-shared = { workspace = true }

[tool.uv.build-backend]
module-root = ""
module-name = "chess_training"