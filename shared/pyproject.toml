[build-system]
requires = ["uv_build>=0.9.0,<0.12"]
build-backend = "uv_build"

[project]
name = "chess-shared"
version = "0.1.0"
description = "Board/move encoding shared between the data, training, and backend packages. Single source of truth so preprocessing and inference can never drift apart."
authors = [
    {name = "Mallem Sofiane",email = "melsopv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-chess>=1.999",
    "numpy>=1.26",
]

[tool.uv.build-backend]
module-root = ""
module-name = "chess_shared"